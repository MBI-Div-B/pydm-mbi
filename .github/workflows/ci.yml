name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      TANGO_HOST: localhost:10000
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Start Tango with TangoTest
        run: docker compose -f ci/docker-compose.yml up -d

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: pydm-mbi
          create-args: >-
            python=3.12 pyqt=5 pytango pydm pytest pytest-qt ruff
            libxkbcommon fontconfig

      # TODO: remove once a pydm release contains the Tango plugin (slaclab/pydm#1360)
      - name: Install pydm with the Tango plugin
        run: pip install --no-deps "git+https://github.com/dschick/pydm@tango_commands"

      - name: Install pydm-mbi
        run: pip install --no-deps -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # No explicit `exit`: in a login shell (bash -l) it runs ~/.bash_logout, which turns `exit 0` into 1
      - name: Wait for TangoTest
        run: |
          up=false
          for i in $(seq 60); do
            if python -c "import tango; tango.DeviceProxy('sys/tg_test/1').ping()" 2>/dev/null; then
              up=true
              break
            fi
            sleep 2
          done
          if [ "$up" = false ]; then
            echo "TangoTest did not start"
            docker compose -f ci/docker-compose.yml logs
            false
          fi
          echo "TangoTest is up"

      - name: Test
        run: pytest -v
